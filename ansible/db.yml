---
- hosts: db
  become: true
  vars_files: [group_vars/all.yml]
  tasks:
    - name: Install MariaDB
      ansible.builtin.shell: dnf -y install mariadb105-server mariadb105

    - name: Enable and start MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes

    - name: Allow connections on all interfaces
      ansible.builtin.lineinfile:
        path: /etc/my.cnf.d/mariadb-server.cnf
        insertafter: '^\[mysqld\]'
        line: 'bind-address=0.0.0.0'
      notify: restart mariadb

    - name: Create DB and user
      ansible.builtin.shell: |
        mysql -u root -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
        mysql -u root -e "CREATE USER IF NOT EXISTS '{{ db_user }}'@'%' IDENTIFIED BY '123benhart#$';"
        mysql -u root -e "GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_user }}'@'%'; FLUSH PRIVILEGES;"

  handlers:
    - name: restart mariadb
      ansible.builtin.service:
        name: mariadb
        state: restarted


-- Remove existing taskuser if any
DROP USER IF EXISTS 'taskuser'@'localhost';
DROP USER IF EXISTS 'taskuser'@'%';

-- Create new user that can connect from anywhere
CREATE USER 'taskuser'@'%' IDENTIFIED BY '123benhart#$';

-- Grant privileges (replace 'your_database_name' with actual database name)
GRANT ALL PRIVILEGES ON taskdb.* TO 'taskuser'@'%';

-- Or if you want to grant access to all databases
GRANT ALL PRIVILEGES ON *.* TO 'taskuser'@'%';

-- Apply changes
FLUSH PRIVILEGES;

-- Verify the user was created
SELECT User, Host FROM mysql.user WHERE User = 'taskuser';