name: Backend CI/CD

on:
  push:
    branches: [ mytaskapp ]
    paths:
      - 'taskapp/backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: backend-mytaskapp
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - name: Build JAR (skip tests)
        run: |
          mvn -q -DskipTests clean package -Dmaven.compiler.release=17 -f taskapp/backend/pom.xml
          ls -lh taskapp/backend/target/*.jar

      - name: Upload JAR to EC2 (/tmp/app.jar)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_APP_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "taskapp/backend/target/*.jar"
          target: "/tmp/app_upload"
          overwrite: true

      - name: Restart backend service
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_APP_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/taskapp/backend
      
            # pick the newest jar we just uploaded
            pwd
            cd ~
            if [ -f /opt/taskapp/backend/app.jar ]; then
            sudo cp /opt/taskapp/backend/app.jar /opt/taskapp/backend/app.jar.bak
            fi
            sudo rm -rf /opt/taskapp/backend/app.jar
            sudo cp -r /tmp/app_upload/taskapp/backend/target/*.jar /opt/taskapp/backend/app.jar
         
            pwd
            sudo chown ec2-user:ec2-user /opt/taskapp/backend/app.jar
            sudo systemctl daemon-reload || true
            sudo systemctl restart taskapp
            sleep 3
            curl -sf http://localhost:3030/actuator/health || (echo "Health check failed" && exit 1)
